name: ticlasec

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ticlasec-postgres
    environment:
      POSTGRES_USER: ticlasec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ticlasec
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticlasec -d ticlasec"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticlasec-net

  # Tor Proxy (local Dockerfile — includes python3 for healthcheck)
  tor:
    build:
      context: .
      dockerfile: docker/Dockerfile.tor
    container_name: ticlasec-tor
    ports:
      - "9050:9050"
      # Destination-isolated SocksPort used by the Playwright renderer — see
      # docker/Dockerfile.tor for why that path needs its own port.
      - "9250:9250"
    volumes:
      - tor_data:/var/lib/tor
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect(('127.0.0.1', 9050)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ticlasec-net

  # Experimental, private linked-device bridge. No public port or Meta API keys.
  whatsapp-bridge:
    build: ./whatsapp-bridge
    container_name: ticlasec-whatsapp-bridge
    restart: unless-stopped
    environment:
      BACKEND_URL: http://fastapi:8000
      WHATSAPP_MAX_SESSIONS: ${WHATSAPP_MAX_SESSIONS:-10}
    volumes:
      - whatsapp_sessions:/data
      - whatsapp_bridge_secrets:/run/bridge-secrets
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - ticlasec-net

  # FastAPI Backend (uses root Dockerfile with multi-stage build)
  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
      args:
        PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-false}
    container_name: ticlasec-fastapi
    entrypoint: ["/bin/bash", "/app/docker/docker-entrypoint.sh"]
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    # depends_on only affects RUNTIME (not build), allowing parallel builds
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ticlasec:${POSTGRES_PASSWORD}@postgres:5432/ticlasec
      TOR_PROXY_HOST: tor
      TOR_PROXY_PORT: 9050
      MEILI_HOST: ${MEILI_HOST:-}
      MEILI_KEY: ${MEILI_KEY:-}
      MEILI_INDEX: ${MEILI_INDEX:-onion_pages}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_NUMBER: ${WHATSAPP_BUSINESS_NUMBER:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
      WHATSAPP_MODE: ${WHATSAPP_MODE:-qr}
      WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:8090
      WHATSAPP_BRIDGE_SECRET_FILE: /run/bridge-secrets/bridge.key
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      HETZNER_API_KEY: ${HETZNER_API_KEY:-}
      HETZNER_BASE_URL: ${HETZNER_BASE_URL:-https://inference.hetzner.com/api/v1}
      OTX_API_KEY: ${OTX_API_KEY}
      ABUSECH_API_KEY: ${ABUSECH_API_KEY}
      BLOCKCYPHER_TOKEN: ${BLOCKCYPHER_TOKEN}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY}
      PYTHONUNBUFFERED: 1
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001"
      JWT_SECRET: ${JWT_SECRET}
      # Normal product mode. Set true explicitly to pause collection for a study.
      TICLASEC_RESEARCH_MODE: ${TICLASEC_RESEARCH_MODE:-false}
      TICLASEC_MFA_KEY_FILE: /run/research-secrets/mfa.key
      PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-false}
      DEEPL_API_KEY: ${DEEPL_API_KEY}
      I18N_LANGUAGES: ${I18N_LANGUAGES:-en,ru,zh}
    ports:
      - "8000:8000"
    volumes:
      - ../.research-secrets:/run/research-secrets:ro
      - whatsapp_bridge_secrets:/run/bridge-secrets:ro
      - monitors_data:/app/data
    networks:
      - ticlasec-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      # Seed import runs in the background (see docker/docker-entrypoint.sh),
      # so uvicorn typically boots in ~30s. The generous start_period accounts
      # for slow VMs / disks / first-time pip cache misses on restart.
      interval: 10s
      timeout: 5s
      start_period: 240s
      retries: 5

  # Next.js Frontend
  nextjs:
    build:
      context: .
      dockerfile: docker/Dockerfile.nextjs
      args:
        NEXT_PUBLIC_PRODUCT_NAME: ${NEXT_PUBLIC_PRODUCT_NAME:-TiclaSec}
        NEXT_PUBLIC_PRODUCT_LONG_NAME: ${NEXT_PUBLIC_PRODUCT_LONG_NAME:-AI Threat Collection & Intelligence System}
    container_name: ticlasec-nextjs
    depends_on:
      # Only needed during runtime, NOT for build
      fastapi:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://fastapi:8000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3001:3000"
    networks:
      - ticlasec-net

volumes:
  whatsapp_sessions:
    name: ticlasec_whatsapp_sessions
    driver: local
  whatsapp_bridge_secrets:
    name: ticlasec_whatsapp_bridge_secrets
    driver: local
  postgres_data:
    name: ticlasec_postgres_data
    driver: local
  monitors_data:
    name: ticlasec_monitors_data
    driver: local
  tor_data:
    name: ticlasec_tor_data
    driver: local

networks:
  ticlasec-net:
    driver: bridge
